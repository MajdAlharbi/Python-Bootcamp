<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day3</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <p class="note" id="main-note">
        Hello CSS
    </p>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Enter your Name: </label>
            <input type="text" name="name" id="name">
            <br>
            <br>
            <label for="email">Enter your Email: </label>
            <input type="email" name="email" id="email">
            <br>
            <br>
            <label for="age">Enter your Age: </label>
            <input type="number" name="age" id="age">
            <br>
            <br>
            <label for="course">Choose your course:</label>
            <select id="course" name="course">
                <option value="Python">Python</option>
                <option value="HTML">HTML</option>
                <option value="CSS">CSS</option>
            </select>
            <br>
            <br>
            <label for="about">Talk about yourself:</label>
            <textarea id="about" name="about"></textarea>
            <br>
            <br>
            <label for="checkbox">I have read the policy:</label>
            <input type="checkbox" name="policy" id="checkbox"> Yes
            <br>
            <br>
            <button type="submit">Submit</button>
        </fieldset>
    </form>
</body>

</html>
