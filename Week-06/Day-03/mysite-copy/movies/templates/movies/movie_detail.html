{% extends "movies/base.html" %}

{% block content %}

<div class="detail-card">

    <h1 class="detail-title">
        {{ movie.title }}
    </h1>

    <p class="detail-info">
        Year: {{ movie.year }}
    </p>

    <p class="detail-info">
        Rating: {{ movie.rating }}
    </p>

    <a class="back-button" href="{% url 'movie_list' %}">
        Back to Movies
    </a>

</div>

{% endblock %}
