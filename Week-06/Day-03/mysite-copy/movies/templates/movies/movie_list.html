{% extends "movies/base.html" %}

{% block content %}

<h1>Movies</h1>

{% for movie in movies %}

<div class="movie-card">

    <div class="movie-title">
        <a href="{% url 'movie_detail' movie.id %}">
            {{ movie.title }}
        </a>
    </div>

    <div class="movie-info">
        Year: {{ movie.year }}
    </div>

    <div class="rating">
        Rating: {{ movie.rating }}
    </div>

</div>

{% endfor %}

{% endblock %}
