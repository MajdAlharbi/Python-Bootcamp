{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Login</h2>
    {% if error %}
    <p>{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <p>
            <label>Username</label><br>
            <input type="text" name="username">
        </p>

        <p>
            <label>Password</label><br>
            <input type="password" name="password">
        </p>

        <button type="submit">Login</button>
    </form>

    <p>
        Need an account?
        <a href="{% url 'register' %}">Register</a>
    </p>

</div>

{% endblock %}
