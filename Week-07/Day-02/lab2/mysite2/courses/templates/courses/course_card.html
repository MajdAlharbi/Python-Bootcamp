{% load static %}

<div class="card">
    <img src="{% static course.image %}" alt="{{ course.name }}">

    <h2>{{ course.name|title }}</h2>

    <p>Level: {{ course.level|title }}</p>

    <p>{{ course.description|truncatewords:10 }}</p>

    {% if course.student_count == 0 %}
    <p>Be the first student to join!</p>
    {% else %}
    <p>{{ course.student_count }} students enrolled</p>
    {% endif %}

    <a href="{% url 'course_detail' course.id %}">
        View Details
    </a>
</div>
